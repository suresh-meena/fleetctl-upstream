interface:
  display_name: "Remote Fleet Operator"
  short_description: "GPUs, jobs and files on the user's fleet via fq, fleetmon and fleetctl"
  default_prompt: "Use $remote-fleet-operator: route the request with its table (fq usage for free GPUs, fq submit/wait/logs for jobs, fleetctl for commands, file transfer and Slurm), check fq whoami and fleetctl doctor, then do the work through the narrowest stable interface."
